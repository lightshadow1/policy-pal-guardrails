<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 790" width="1060" height="790" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Policy Pal guardrail architecture</title>
  <desc>Question flows through local input checks and identifier scrubbing into a Jev decision layer, which routes to refuse, ask for detail, decline politely, or answer. Every decision is logged and reviewed weekly to tune the questions and cutoffs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1060" height="790" fill="#fff"/>
  <style>
    .t{font-size:15px;fill:#0f172a;text-anchor:middle}
    .b{font-weight:700}
    .s{font-size:13px;text-anchor:middle}
    .l{font-size:13px;fill:#334155;text-anchor:middle}
    .e{stroke:#475569;stroke-width:1.6;fill:none}
    .d{stroke:#64748b;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
  </style>

  <!-- start -->
  <rect x="410" y="14" width="200" height="40" rx="20" fill="#1e1b4b"/>
  <text x="510" y="39" class="t" fill="#fff" style="fill:#fff">Employee question</text>
  <path d="M510 54V84" class="e" marker-end="url(#a)"/>

  <!-- 1 -->
  <rect x="310" y="86" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="510" y="112" class="t b" style="fill:#064e3b">1. Input checks · local, free</text>
  <text x="510" y="134" class="s" style="fill:#064e3b">length limit · 14 prompt-injection regexes</text>
  <path d="M510 152V184" class="e" marker-end="url(#a)"/>
  <text x="522" y="173" class="l" style="text-anchor:start">pass</text>

  <!-- 2 -->
  <rect x="310" y="186" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="510" y="212" class="t b" style="fill:#064e3b">2. Scrub identifiers · local</text>
  <text x="510" y="234" class="s" style="fill:#064e3b">SSNs · card numbers · emails</text>
  <path d="M510 252V284" class="e" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="190" y="286" width="640" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.4"/>
  <text x="510" y="316" class="t b" style="fill:#1e1b4b;font-size:16px">3. Decision layer · Jev API</text>
  <text x="510" y="340" class="s" style="fill:#1e1b4b">8 yes/no questions → scores → one fixed rule</text>
  <text x="510" y="362" class="s" style="fill:#1e1b4b">blocked › in scope › ambiguous › irrelevant</text>

  <!-- injection fail path -->
  <path d="M310 119H120V448" class="e" marker-end="url(#a)"/>
  <text x="112" y="270" class="l" style="text-anchor:end">fail (injection)</text>

  <!-- decision arrows -->
  <path d="M290 382V420H120V448" class="e" marker-end="url(#a)"/>
  <path d="M360 382V448" class="e" marker-end="url(#a)"/>
  <path d="M600 382V448" class="e" marker-end="url(#a)"/>
  <path d="M730 382V420H830V448" class="e" marker-end="url(#a)"/>
  <text x="205" y="414" class="l">not_allowed</text>
  <text x="368" y="414" class="l" style="text-anchor:start">ambiguous</text>
  <text x="608" y="414" class="l" style="text-anchor:start">irrelevant</text>
  <text x="780" y="414" class="l" style="text-anchor:start">in_scope</text>

  <!-- outcomes -->
  <rect x="20" y="450" width="200" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="120" y="478" class="t b" style="fill:#7f1d1d">Refuse</text>
  <text x="120" y="500" class="s" style="fill:#7f1d1d">log the topic</text>

  <rect x="260" y="450" width="200" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="360" y="478" class="t b" style="fill:#78350f">Ask for detail</text>
  <text x="360" y="500" class="s" style="fill:#78350f">ambiguous question</text>

  <rect x="500" y="450" width="200" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="600" y="478" class="t b" style="fill:#78350f">Decline politely</text>
  <text x="600" y="500" class="s" style="fill:#78350f">company policy only</text>

  <rect x="730" y="450" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.4"/>
  <text x="830" y="478" class="t b" style="fill:#064e3b">4. Retrieval + answer</text>
  <text x="830" y="500" class="s" style="fill:#064e3b">existing Policy Pal</text>

  <!-- bus to log -->
  <path d="M120 522V560M360 522V560M600 522V560M830 522V560" class="d"/>
  <path d="M120 560H830" class="d"/>
  <path d="M510 560V600" class="d" marker-end="url(#a)"/>

  <!-- 5 log -->
  <rect x="310" y="602" width="400" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="510" y="628" class="t b">5. Decision log</text>
  <text x="510" y="650" class="s" style="fill:#0f172a">question · scores · response, every branch</text>
  <path d="M510 668V700" class="e" marker-end="url(#a)"/>

  <!-- review -->
  <rect x="310" y="702" width="400" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="510" y="728" class="t b" style="fill:#334155">Weekly review of misses</text>
  <text x="510" y="750" class="s" style="fill:#334155">new tuning set → edit a question or a cutoff</text>

  <!-- feedback loop -->
  <path d="M710 735H1010V334H830" class="d" marker-end="url(#a)"/>
  <text x="1002" y="560" class="l" transform="rotate(-90 1002 560)">tunes questions and cutoffs</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
