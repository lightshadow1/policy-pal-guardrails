[project]
name = "ppguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
